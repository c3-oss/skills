name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache uv dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          # Cache the resolved Nix store so devbox install only does work
          # when devbox.lock changes. Pin devbox-version so the installed CLI
          # matches the committed lock and does not rewrite it mid-job.
          enable-cache: "true"
          devbox-version: 0.17.4

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          # pnpm's default store on Linux (XDG). Hardcoded rather than resolved
          # via `pnpm store path`, whose output devbox interleaves with its own
          # lockfile messages.
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Cache lychee link checker
        uses: actions/cache@v5
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-${{ hashFiles('**/*.md') }}
          restore-keys: |
            lychee-${{ runner.os }}-

      - name: Install dependencies
        run: devbox run -- uv sync --locked --dev

      - name: Install Node dependencies
        run: devbox run -- pnpm install --frozen-lockfile

      - name: Validate pre-commit config
        run: devbox run -- pre-commit validate-config

      - name: Lint commit messages
        # Only meaningful on PRs (the pre-merge gate) and on pushes to the
        # default branch (catch what actually lands on master). Skip on
        # feature/dependabot branch pushes, where github.event.before is
        # unreliable — it is all-zeros on branch creation and an orphaned SHA
        # after a rebase/force-push, which makes the before..sha range lint
        # unrelated history or crash with "Invalid revision range".
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Compare against the freshly fetched base tip (FETCH_HEAD). The
            # origin/<base> remote-tracking ref is unreliable on a PR checkout
            # and can point at an old commit, which would lint the whole
            # history instead of just this PR's commits.
            git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
            commit_range="FETCH_HEAD..HEAD"
          elif [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]] ||
               ! git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            # Branch creation or a force-push that orphaned the previous tip:
            # lint only the pushed head.
            commit_range="${{ github.sha }}"
          else
            commit_range="${{ github.event.before }}..${{ github.sha }}"
          fi
          devbox run -- uv run gitlint --commits "$commit_range"

      - name: Run pre-commit quality gates
        run: devbox run -- pre-commit run --hook-stage pre-commit --all-files

      - name: Run pre-push quality gates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: devbox run -- pre-commit run --hook-stage pre-push --all-files

  validate-plugin:
    name: Validate plugin structure
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugin manifests
        run: claude plugin validate .

  test-install:
    name: Test skill installation
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: validate-plugin

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git to use HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Add marketplace
        run: claude plugin marketplace add ./

      - name: List marketplaces
        run: claude plugin marketplace list

      - name: Install plugin
        run: claude plugin install skills@c3-skills --scope user

      - name: List skills with the skills CLI
        run: npx -y skills add ./ --list
